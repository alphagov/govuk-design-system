name: Check changelog updated

on:
  workflow_call:

jobs:
  changelog_change_comment:
    name: Changelog change comment
    runs-on: 'ubuntu-24.04'
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Build
        uses: ./.github/workflows/actions/install-and-build

      - name: Generate name-status diff
        run: git diff --name-status origin/${{ github.base_ref }} origin/${{ github.head_ref }} > diff.txt

      - name: Get changed pages and changelogs
        id: get-changed-things
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const { getFilesFromDiff } = await import('${{ github.workspace }}/.github/workflows/scripts/index.mjs')
            return getFilesFromDiff(/src\/[a-z-]+\/[a-z-]+\/index\.md|src\/[a-z-]+\/[a-z-]+\/changelog\.yml/, 'M')

      - name: Compare pages and changelogs to check if all page changes have an equivalent changelog change
        if: steps.get-changed-things.outputs.result != 'false'
        id: pages-with-changelogs
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const { getFileSiblings } = await import('${{ github.workspace }}/.github/workflows/scripts/index.mjs')
            const files = ${{ steps.get-changed-things.outputs.result }}
            console.log(files.split(','))
            return getFileSiblings(files.split(','), '${{ github.workspace }}', 'index.md', 'changelog.yml')

      - name: Post a comment on the PR if a page has changed but that page's changelog hasn't
        if: steps.pages-with-changelogs.outputs.result != 'false' && steps.get-changed-things.outputs.result != 'false'
        id: post-comment
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const { prepareCommentBody, comment } = await import('${{ github.workspace }}/.github/workflows/scripts/index.mjs')
            const files = ${{ steps.pages-with-changelogs.outputs.result }}
            const outro = `Please ensure that you add a changelog entry, if your change warrants a new entry.

            Read our [guidance on change history maintenance](https://gov-uk.atlassian.net/wiki/spaces/GDS/pages/5773131777/How+to+add+changelog+entries) for details on how ot write new changelog entries and if a change to a page warrants a new entry.`

            const commentBody = prepareCommentBody(
              "It looks like this pull request makes a change to one or more pages but doesn't update those page's changelogs:",
              files.split(','),
              outro)

            await comment({ github, context },
              ${{ github.event.pull_request.number }},
              'pages-changed-without-changelog-change',
              commentBody)
