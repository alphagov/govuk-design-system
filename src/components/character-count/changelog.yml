  description: Added option to add classes to the count message.
- date: 2020-07-29
  version: 3.8.0
  description: |
    Added spellcheck option.

    Added preservation of component state when navigating 'back' in the browser.
- date: 2020-08-13
  version: 3.8.1
  description: Fixed `textarea` within Character count to prevent it shrinking as users exceed the character limit.
- date: 2021-02-08
  version: 3.11.0
