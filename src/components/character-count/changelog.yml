- date: 2022-05-18
  version: 4.1.0
  description: |
    Removed `aria-live` from the Character count component.

    Added new live-updated accessible announcements.

    Added option to remove of `maxlength` attribute from `textarea` after character count JavaScript has been initialised.
- date: 2022-05-18
  description: Added known issues with assistive technology.
- date: 2022-05-18
  description: Explained that input shows a red border only when user exceeds character limit.
- date: 2022-11-14
  version: 4.4.0
  description: Added option to localise the Character count's textarea description, count message and input description.
- date: 2023-12-08
  version: 5.0.0
  description: Added option to throw `ElementError` for missing elements during Character count component instantiation.
- date: 2024-03-26
  version: 5.3.0
  description: Changed component element to also include form group wrapper.
- date: 2024-10-21
  description: Added details of accessibility improvements to the Character count component.
- date: 2025-03-04
  version: 5.9.0
  description: |
    Changed component `id` attribute to be based on `name` parameter by default.

    Added focused error state to Character count component.
