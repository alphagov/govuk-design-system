- date: 2019-04-25
  version: 2.11.0
  description: |
    Added support for custom row classes.

    Fixed the 1px row height change when borders are removed, padding is adjusted by 1px instead.

    Fixed the text alignment when the actions column isn't added so the key column always stays at 30% width.
- date: 2019-05-28
  version: 2.12.0
  description: Support custom attributes.
