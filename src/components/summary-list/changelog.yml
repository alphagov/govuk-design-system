- date: 2021-12-02
  description: Updated examples to use 'Address' instead of 'contact information' to avoid confusion with 'contact details'.
- date: 2021-12-16
  version: 4.0.0
  description: Updated the HTML for the summary list component to avoid nesting `<span>` elements within `<dd>` elements.
- date: 2022-02-08
  version: 4.0.1
  description: Added explicit width to the row with 'no actions' pseudo-element.
- date: 2022-08-09
  version: 4.3.0
  description: |
    Fixed action link alignment.

    Removed padding-right from last column in the row.
- date: 2023-01-31
  version: 4.5.0
  description: Added Summary card enhancement. This provides visual seperation between multiple Summary lists on a single page.
- date: 2023-03-28
  description: Added guidance on using bold text on card actions to differentiate from row actions for screen magnification users.
- date: 2023-06-30
  description: Added example with missing information.
- date: 2023-11-04
  description: Updated examples to show a row with multiple actions.
- date: 2024-01-11
  description: Added WCAG 2.2 guidance on minimum sizing and spacing.
- date: 2025-05-08
  description: Removed WCAG 2.2 guidance.
