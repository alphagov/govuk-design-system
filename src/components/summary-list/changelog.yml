- date: 2019-01-10
  version: 2.5.0
  description: Component introduced.
- date: 2019-01-16
  version: 2.5.1
  description: Fixed actions to only be output as a list if there is more than one action.
- date: 2019-01-16
  description: Updated explanation for how visually hidden text is added to action links.
- date: 2019-02-08
  version: 2.7.0
  description: Fixed wrapping of long, unbroken lines of text.
- date: 2019-03-05
  version: 2.8.0
  description: Fixed word wrapping to work more consistently across all browsers.
- date: 2019-03-18
  version: 2.9.0
  description: Added `classes` parameter to action items.
- date: 2019-04-25
  version: 2.11.0
  description: |
    Added support for custom classes on summary list rows.

    Fixed 1px row height change when borders are removed, adjusting padding by 1px instead.

    Fixed text alignment when the actions column isn't added so the key column always stays at 30% width.
- date: 2019-05-28
  version: 2.12.0
  description: Added `attributes` parameter for action links.
- date: 2020-08-11
  description: Added content on the `govuk-summary-list__row-no-border` class which removes borders on a single row.
- date: 2021-12-16
  version: 4.0.0
  description: |
    Changed component HTML to avoid nesting `<span>` elements within `<dd>` elements, which goes against the HTML spec.

    Added `govuk-summary-list__row--no-actions` class to manage display of rows which don't have actions next to other rows in a summary list which do have actions.
- date: 2022-02-08
  version: 4.0.1
  description: Added explicit width to the row with 'no actions' pseudo-element.
- date: 2022-08-09
  version: 4.3.0
  description: |
    Fixed action link alignment when there are multiple action lints in a single row.

    Removed right-hand padding from last column in a row.
- date: 2023-01-31
  version: 4.5.0
  description: Added Summary card variant to provide visual separation between multiple Summary lists on a single page.
- date: 2023-04-25
  description: Added guidance on using bold text on card actions to differentiate from row actions for screen magnification users.
- date: 2023-08-25
  description: Added guidance on showing summary lists with missing information.
- date: 2023-12-08
  version: 5.0.0
  description: Changed action link HTML to add the title of the summary card or list as visually hidden text after the link text.
- date: 2024-01-11
  description: |
    Added guidance on not changing spacing of action links in order to comply with WCAG 2.2.

    Added guidance on pre-populating previously entered information in order to comply with WCAG 2.2.
- date: 2025-03-04
  version: 5.9.0
  description: Fixed card action link appearance when there are lots of links.
- date: 2025-05-08
  description: Removed guidance on changing spacing of action links.
- date: 2026-03-02
  version: 6.1.0
  description: Fixed cells becoming vertically misaligned when a multi-line inline-block element is present.
