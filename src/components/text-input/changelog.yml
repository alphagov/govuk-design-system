- date: 2018-06-21
  version: 1.0.0
  description: Component introduced.
- date: 2018-11-19
  version: 2.4.0
  description: Classes can now be set on the input's `formGroup`.
- date: 2019-01-31
  version: 2.6.0
  description: Added `autocomplete` parameter.
- date: 2019-02-06
  description: Added guidance on supporting autofill using `autocomplete`.
- date: 2019-02-18
  description: Added guidance on supporting spellchecking.
- date: 2019-03-05
  version: 2.8.0
  description: Added `pattern` parameter.
- date: 2019-07-29
  version: 3.0.0
  description: Updated focus style to comply with WCAG 2.1.
- date: 2019-09-02
  version: 3.1.0
  description: Added `inputmode` parameter.
- date: 2020-02-04
  description: Added guidance about asking for numbers.
- date: 2020-06-10
  description: Added guidance to advise against using `inputmode="decimal"` due to inconsistent behaviour across devices.
- date: 2020-07-29
  version: 3.8.0
  description: |
    Added `spellcheck` parameter.

    Updated input's border thickness when in the error state.
- date: 2020-09-14
  version: 3.9.0
  description: Added input prefixes and suffixes.
- date: 2022-02-10
  description: Added guidance advising to support all characters a user might reasonably need to enter when performing validation.
- date: 2022-04-28
  description: Added guidance on use of placeholder text.
- date: 2022-08-09
  version: 4.3.0
  description: Updated length modifier classes to use `em` units.
- date: 2022-08-19
  description: Removed guidance on using the `pattern` attribute to force iOS to show a numpad. Use `inputmode` instead.
- date: 2023-04-20
  version: 4.6.0
  description: |
    Added `disabled` parameter and updated input disabled styles.

    Added guidance and modifier class for codes and sequences.
- date: 2023-08-14
  description: Added guidance to not restrict the length of a user's input.
- date: 2024-02-05
  version: 5.1.0
  description: Updated positioning of input prefixes and suffixes.
- date: 2024-02-16
  description: Updated guidance to advise against placing complex instructions inside of hint text. Put them before the question instead. See [our guidance on complex questions](/patterns/question-pages/#asking-complex-questions-without-using-hint-text).
- date: 2024-02-21
  version: 5.2.0
  description: Added `beforeInput` and `afterInput` slots.
- date: 2024-05-17
  version: 5.4.0
  description: Fixed being unable to set the `value` parameter if the value was '0'.
- date: 2024-10-04
  description: Expanded guidance on writing and formatting hint text.
- date: 2025-03-04
  version: 5.9.0
  description: The `id` parameter now defaults to match `name` if an `id` isn't provided.
- date: 2026-03-02
  version: 6.1.0
  description: Fixed focus state using wrong shade of black.
- date: 2026-06-02
  description: Changed guidance about `inputmode="decimal"` to suggest using it when asking for decimal numbers, unless the number can be negative.
- date: 2026-06-23
  version: 6.3.0
  description: Fixed input prefixes and suffixes not having a text colour set, which could result in insufficient text contrast in some situations.
