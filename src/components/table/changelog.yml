- date: 2019-01-09
  description: Added guidance about using [width override classes](/styles/layout/#width-override-classes) to customise column widths.
- date: 2019-07-29
  version: 3.0.0
  description: Changed the default vertical alignment of content to be at the top of the cell.
- date: 2021-02-08
