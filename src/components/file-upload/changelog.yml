  description: Added an improved file upload which uses a Javascript enhancement.
- date: 2025-03-04
  description: Added guidance for the improved file upload.
- date: 2025-05-08
  description: Removed WCAG 2.2 guidance.
- date: 2025-08-22
  version: 5.11.2
  description: Fixed the improved file upload being hidden with an empty label.
- date: 2025-10-10
  version: 5.13.0
  description:
    Update to account for `multiple` attribute when using the improved file upload.

    Fixed long filenames in improved file upload not wrapping.
- date: 2025-12-12
  description: Added an update to the research on this component section.
- date: 2026-02-09
