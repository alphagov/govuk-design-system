- date: 2018-07-13
  version: 1.1.0
  description: Added outline around tags in forced colours mode.
- date: 2018-08-15
  version: 1.3.0
  description: Adjusted vertical alignment of text when using GDS Transport font v1.
- date: 2020-03-06
  version: 3.6.0
  description: Added colour modifier classes.
- date: 2020-04-17
  description: Updated guidance to explain why tag text should use adjectives.
- date: 2021-12-16
  version: 4.0.0
  description: Replaced `govuk-tag--inactive` modifier class with `govuk-tag--grey`.
- date: 2023-12-08
  version: 5.0.0
  description: |
    Updated tag text to be a larger size, regular weight and use sentence case.

    Updated colours to use lighter variants, to make tags easier to distinguish from buttons.
- date: 2024-01-11
  description: |
    Added guidance to advise against using tags for links, buttons or other interactive elements.

    Added guidance to explain that any drag-and-drop interactions must comply with [accessibility guidance on dragging movements](https://www.w3.org/WAI/WCAG22/Understanding/dragging-movements).
- date: 2025-05-15
  description: Removed guidance on drag-and-drop interactions.
- date: 2026-02-09
  version: 6.0.0
  description: Updated colours to align with the refreshed GOV.UK brand colours.
